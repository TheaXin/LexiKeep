name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_project.py
      - run: node scripts/test_translation.cjs
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexikeep-extension
          path: dist/*.zip
