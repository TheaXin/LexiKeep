name: Deploy product showcase to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_project.py
      - name: Prepare showcase
        run: |
          mkdir -p _site/src _site/assets
          cp showcase.html _site/index.html
          cp demo-page.html _site/
          cp src/dictionary.html src/dictionary.js src/styles.css _site/src/
          cp assets/dictionary.json _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
